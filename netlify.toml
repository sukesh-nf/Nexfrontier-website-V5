[build]
command = "npm run build"
publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
for = "/*"
  [headers.values]
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  X-Frame-Options = "DENY"
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://bjkvgobjxduhvxyjbujo.supabase.co; frame-src https://drive.google.com https://docs.google.com; upgrade-insecure-requests"

[[headers]]
for = "/investor-admin/*"
  [headers.values]
  Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
  Pragma = "no-cache"

[[headers]]
for = "/investor-data-room/*"
  [headers.values]
  Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
  Pragma = "no-cache"

[[redirects]]
from = "/investor"
to = "/investor-proof"
status = 301
force = true

[[redirects]]
from = "/market-evidence"
to = "/hyper-accelerating-markets"
status = 301
force = true
